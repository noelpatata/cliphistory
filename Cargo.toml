[workspace]
resolver = "2"
members = [
    "crates/proto",
    "crates/image-utils",
    "crates/core",
    "crates/modules/clipboard-common",
    "crates/modules/clipboard-wayland",
    "crates/modules/clipboard-x11",
    "crates/modules/frontend-common",
    "crates/modules/frontend-rofi",
    "crates/modules/frontend-wofi",
    "crates/modules/frontend-dmenu",
]

[workspace.package]
version = "1.0.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/noelpatata/cliphistory"
authors = ["cliphistory contributors"]

[workspace.dependencies]
cliphistory-proto = { path = "crates/proto" }
cliphistory-image-utils = { path = "crates/image-utils" }
cliphistory-clipboard-common = { path = "crates/modules/clipboard-common" }
cliphistory-frontend-common = { path = "crates/modules/frontend-common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
toml = "0.8"
dirs = "5"
hex = "0.4"
base64 = "0.22"
ureq = { version = "2", features = ["json"] }
env_logger = "0.11"
tempfile = "3"
wl-clipboard-rs = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
