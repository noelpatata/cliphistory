[workspace]
resolver = "2"
members = [
    "crates/proto",
    "crates/image-utils",
    "crates/core",
    "crates/modules/clipboard-wayland",
    "crates/modules/clipboard-x11",
    "crates/modules/module-common",
    "crates/modules/paster-uinput",
    "crates/modules/frontend-generic",
]

[workspace.package]
version = "0.0.10"
edition = "2021"
license = "MIT"
repository = "https://github.com/noelpatata/cliphistory"
authors = ["cliphistory contributors"]

[workspace.dependencies]
cliphistory-proto = { path = "crates/proto" }
cliphistory-image-utils = { path = "crates/image-utils" }
cliphistory-module-common = { path = "crates/modules/module-common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
toml = "0.8"
dirs = "5"
hex = "0.4"
base64 = "0.22"
ureq = { version = "2", features = ["json"] }
env_logger = "0.11"
tempfile = "3"
libc = "0.2"
wl-clipboard-rs = "0.9"
x11rb = { version = "0.13", features = ["xfixes"] }
eframe = { version = "0.31", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
image = { version = "0.25", default-features = false, features = ["png"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-scanner = "0.31"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
