[package]
name = "cliphistory-core"
description = "cliphistory daemon and CLI: modular clipboard history manager for Linux"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "cliphistory_core"
path = "src/lib.rs"

[[bin]]
name = "cliphistory"
path = "src/main.rs"

[dependencies]
cliphistory-proto = { workspace = true }
cliphistory-image-utils = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
clap = { workspace = true }
rusqlite = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
hex = { workspace = true }
ureq = { workspace = true }
env_logger = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
