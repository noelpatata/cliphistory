[package]
name = "cliphistory-paster-wayland"
description = "cliphistory paster for Wayland: injects ctrl+v into the focused surface via zwp_virtual_keyboard_v1 (no external tools)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cliphistory-paster-wayland"
path = "src/main.rs"

[dependencies]
cliphistory-proto = { workspace = true }
cliphistory-clipboard-common = { workspace = true }
wayland-client = "0.31"
wayland-backend = "0.3"
wayland-scanner = "0.31"
anyhow = { workspace = true }
serde_json = { workspace = true }
